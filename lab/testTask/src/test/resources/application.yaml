spring:
  datasource:
    driver-class-name: org.h2.Driver
    # MODE=PostgreSQL заставляет H2 эмулировать диалект Постгреса, чтобы наши сложные запросы работали
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Для тестов используем create-drop: перед каждым тестом база создается с нуля, а после - уничтожается
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  docker:
    compose:
      enabled: false